<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/></marker></defs><g font-family="Arial, Helvetica, sans-serif" fill="#111" stroke-width="1.5"><text x="600.0" y="28" font-size="24" text-anchor="middle">Local Search Engine — CLI and web interfaces</text><text x="140" y="85" font-size="18" text-anchor="middle">Command line</text><rect x="30" y="110" width="220" height="80" fill="white" stroke="#222"/><text x="140.0" y="155.95" font-size="17" text-anchor="middle">CLI / REPL</text><rect x="560" y="110" width="300" height="80" fill="white" stroke="#222"/><text x="710.0" y="155.95" font-size="17" text-anchor="middle">C++17 engine</text><polyline points="250,150 560,150" fill="none" stroke="#222" marker-end="url(#arrow)"/><text x="405" y="135" font-size="16" text-anchor="middle">Native call</text><text x="650" y="227" font-size="16" text-anchor="middle">REPL keeps the index loaded between queries.</text><text x="140" y="265" font-size="18" text-anchor="middle">Web</text><rect x="30" y="290" width="220" height="80" fill="white" stroke="#222"/><text x="140.0" y="335.95" font-size="17" text-anchor="middle">Streamlit UI</text><rect x="350" y="290" width="200" height="80" fill="white" stroke="#222"/><text x="450.0" y="335.95" font-size="17" text-anchor="middle">FastAPI</text><rect x="650" y="290" width="160" height="80" fill="white" stroke="#222"/><text x="730.0" y="335.95" font-size="17" text-anchor="middle">pybind11</text><rect x="910" y="290" width="260" height="80" fill="white" stroke="#222"/><text x="1040.0" y="335.95" font-size="17" text-anchor="middle">Resident C++17 engine</text><polyline points="250,330 350,330" fill="none" stroke="#222" marker-end="url(#arrow)"/><text x="300.0" y="315" font-size="15" text-anchor="middle">HTTP</text><polyline points="550,330 650,330" fill="none" stroke="#222" marker-end="url(#arrow)"/><text x="600.0" y="315" font-size="15" text-anchor="middle">Binding</text><polyline points="810,330 910,330" fill="none" stroke="#222" marker-end="url(#arrow)"/><text x="860.0" y="315" font-size="15" text-anchor="middle">Native call</text><text x="600" y="425" font-size="17" text-anchor="middle">The API holds immutable snapshots and supports safe reload.</text><text x="600" y="458" font-size="17" text-anchor="middle">Uploads create isolated temporary collections.</text></g></svg>