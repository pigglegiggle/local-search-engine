<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/></marker></defs><g font-family="Arial, Helvetica, sans-serif" fill="#111" stroke-width="1.5"><text x="600.0" y="28" font-size="24" text-anchor="middle">Local Search Engine — indexing and persistence</text><rect x="30" y="125" width="220" height="90" fill="white" stroke="#222"/><text x="140.0" y="164.95" font-size="17" text-anchor="middle">Local UTF-8 files</text><text x="140.0" y="186.95" font-size="17" text-anchor="middle">Text + source code</text><rect x="320" y="125" width="220" height="90" fill="white" stroke="#222"/><text x="430.0" y="164.95" font-size="17" text-anchor="middle">Read + tokenize</text><text x="430.0" y="186.95" font-size="17" text-anchor="middle">Bounded worker pool</text><rect x="610" y="125" width="250" height="90" fill="white" stroke="#222"/><text x="735.0" y="165.1" font-size="16" text-anchor="middle">Deterministic merge</text><text x="735.0" y="186.1" font-size="16" text-anchor="middle">Term → doc IDs → positions</text><rect x="930" y="125" width="240" height="90" fill="white" stroke="#222"/><text x="1050.0" y="164.95" font-size="17" text-anchor="middle">Snapshot (.lsi)</text><text x="1050.0" y="186.95" font-size="17" text-anchor="middle">Delta / varint + CRC32</text><polyline points="250,170 320,170" fill="none" stroke="#222" marker-end="url(#arrow)"/><polyline points="540,170 610,170" fill="none" stroke="#222" marker-end="url(#arrow)"/><polyline points="860,170 930,170" fill="none" stroke="#222" marker-end="url(#arrow)"/><rect x="610" y="300" width="250" height="65" fill="white" stroke="#222"/><text x="735.0" y="338.45" font-size="17" text-anchor="middle">Previous snapshot</text><polyline points="735,300 735,215" fill="none" stroke="#222" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="925" y="280" font-size="16" text-anchor="middle">Reuse unchanged postings</text><text x="1050" y="250" font-size="14" text-anchor="middle">fsync → rename → directory sync</text><text x="600" y="415" font-size="17" text-anchor="middle">Every update reads source bytes and writes a complete replacement snapshot.</text></g></svg>